<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김태연 - 프로젝트 포트폴리오</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header class="intro">
    <div class="intro-top">
      <img class="profile-photo" src="assets/profile/profile.jpg" alt="김태연 프로필 사진">
      <div>
        <h1>김태연</h1>
        <p class="role">진학 데이터 분석 · 교육 현장 자동화 도구 개발</p>
      </div>
    </div>
    <p class="summary">
      대입 진학상담 분석과 학교 업무에서 반복되는 수작업을 자동화 도구로 바꾸는 바이브코더입니다.
    </p>
  </header>

  <div id="categories"></div>

  <footer>
    <p>비공개 저장소 프로젝트는 소속 기관 정보를 일반화하여 소개합니다. 카드를 클릭하면 상세 내용을 볼 수 있습니다.</p>
  </footer>

</div>

<dialog id="detail-dialog">
  <button class="dialog-close" aria-label="닫기">×</button>
  <div id="detail-content"></div>
</dialog>

<script src="js/projects.js"></script>
<script src="js/main.js"></script>
</body>
</html>
