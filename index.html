<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>김태연 - 프로젝트 포트폴리오</title>
<meta name="description" content="대입 진학상담 분석과 학교 업무 자동화 도구를 만드는 현직 고교 교사의 산출물 모음.">

<!-- 검색에 노출하지 않기로 했으므로 링크 공유가 유일한 유입 경로 — 미리보기가 곧 첫인상이다. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://taeyun-portfolio.pages.dev/">
<meta property="og:title" content="김태연 - 프로젝트 포트폴리오">
<meta property="og:description" content="대입 진학상담 분석과 학교 업무 자동화 도구를 만드는 현직 고교 교사의 산출물 모음.">
<meta property="og:image" content="https://taeyun-portfolio.pages.dev/assets/profile/profile.jpg">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">

<!-- Pretendard: 한글 가변 글꼴. 없으면 아래 대체 글꼴로 떨어질 뿐 화면은 깨지지 않는다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 휴대폰에서만 보이는 머리말. 사이드바가 접히면 이름과 문의 버튼만 위에 붙어 따라온다. -->
<div class="topbar">
  <img src="assets/profile/profile.jpg" alt="">
  <div class="topbar-name"><b>김태연</b><span>고등학교 교사</span></div>
  <button type="button" class="cta cta-sm" data-contact>문의</button>
</div>

<div class="shell">
  <aside class="side" aria-label="소개">
    <div class="me">
      <img src="assets/profile/profile.jpg" alt="김태연 프로필 사진">
      <div><b>김태연</b><span>고등학교 교사</span><span>진학지도 · 학교 업무 도구</span></div>
    </div>
    <p class="say">학교에서 손으로 하던 일을 도구로 바꿉니다.</p>
    <p class="lead">성적 분석, 진학 상담 자료, 교무실 업무. 매번 사람이 옮겨 적던 일을 버튼 하나로 줄이고, 학생 정보는 필요한 곳 밖으로 나가지 않게 만듭니다.</p>
    <button type="button" class="cta" id="contact-btn" data-contact>연수 · 강의 문의</button>
    <div class="nav-wrap">
      <div class="nav-h" id="nav-h">분야</div>
      <!-- 링크가 아니라 목록을 거르는 버튼들이라 nav 랜드마크가 아니다. -->
      <div class="nav" id="tabs" role="group" aria-labelledby="nav-h"></div>
    </div>
    <div class="side-foot">
      <span>관심 · 진학 데이터, 업무 자동화, 개인정보를 지키는 설계</span>
      <span id="last-update"></span>
    </div>
  </aside>

  <main id="works" class="main">
    <div class="works-head">
      <h2 id="works-title">작업 <small id="works-count"></small></h2>
      <div class="seg" role="group" aria-label="보기 방식">
        <button type="button" data-view="list" aria-pressed="true">목록</button>
        <button type="button" data-view="timeline" aria-pressed="false">타임라인</button>
      </div>
    </div>
    <div id="list" class="listview" aria-labelledby="works-title"></div>
    <div id="timeline" class="timeline" hidden></div>
  </main>
</div>

<!-- 제목은 열 때마다 detail-title 로 다시 그려진다 — 대화상자 이름이 프로젝트 이름이 되도록. -->
<dialog id="detail-dialog" aria-labelledby="detail-title">
  <button class="dialog-close" aria-label="닫기">×</button>
  <div id="detail-content"></div>
</dialog>

<dialog id="shot-dialog">
  <button class="dialog-close" aria-label="닫기">×</button>
  <img alt="">
</dialog>

<dialog id="contact-dialog">
  <form id="contact-form" method="dialog">
    <h3>연수 · 강의 · 협업 문의</h3>
    <label>성함 <input type="text" name="name" maxlength="40" required></label>
    <label>연락받으실 곳 (이메일 또는 전화)
      <input type="text" name="contact" maxlength="120" required placeholder="hong@school.kr">
    </label>
    <label>내용
      <textarea name="message" rows="6" maxlength="2000" required placeholder="소속과 문의 내용을 적어 주세요."></textarea>
    </label>
    <!-- 봇 감지용. 사람 눈에는 보이지 않으므로 채워져 오면 자동 제출로 본다. -->
    <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <!-- 전송 결과는 화면에만 뜨면 안 된다 — 비어 있는 채로 먼저 두고 글자만 갈아 끼운다. -->
    <p id="contact-msg" class="message" role="status"></p>
    <div class="contact-actions">
      <button type="button" id="contact-cancel">취소</button>
      <button type="submit" id="contact-send">보내기</button>
    </div>
  </form>
</dialog>

<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "56148f77f2cb4b55838418b6b94746f0"}'></script>
<script src="js/categories.js"></script>
<script src="js/screenshots.js"></script>
<script src="js/main.js"></script>
</body>
</html>
