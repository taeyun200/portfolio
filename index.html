<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>김태연 - 프로젝트 포트폴리오</title>
<meta name="description" content="대입 진학상담 분석과 학교 업무 자동화 도구를 만드는 현직 고교 교사의 산출물 모음.">

<!-- 검색에 노출하지 않기로 했으므로 링크 공유가 유일한 유입 경로 — 미리보기가 곧 첫인상이다. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://taeyun-portfolio.pages.dev/">
<meta property="og:title" content="김태연 - 프로젝트 포트폴리오">
<meta property="og:description" content="대입 진학상담 분석과 학교 업무 자동화 도구를 만드는 현직 고교 교사의 산출물 모음.">
<meta property="og:image" content="https://taeyun-portfolio.pages.dev/assets/profile/profile.jpg">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <div class="container hero-inner">
    <div class="hero-text">
      <p class="eyebrow">김태연 · 현직 고교 교사</p>
      <h1>손이 많이 가는 일은 <em>도구에게</em>,<br>흩어진 데이터는 <em>한 곳에</em></h1>
      <p class="summary">
        매번 손으로 하던 학교 업무를 도구로 바꾸고, 여러 해에 걸쳐 쌓인 진학 기록을 상담에서 바로 쓸 수 있는 형태로 정리합니다.
      </p>
      <p class="interests">
        <strong>관심 분야</strong> 진학 데이터 분석 · 학교 업무 자동화 · 개인정보를 지키는 교육용 도구 설계
      </p>
      <div class="hero-actions">
        <button id="contact-btn" type="button">연수 · 강의 · 협업 문의</button>
        <a class="ghost-btn" href="#works">산출물 둘러보기 ↓</a>
      </div>
    </div>
    <div class="hero-photo">
      <img class="profile-photo" src="assets/profile/profile.jpg" alt="김태연 프로필 사진">
    </div>
  </div>
</header>

<main id="works">
  <div class="container">
    <div id="stats" class="stats"></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="categories"></div>
  </div>
</main>

<dialog id="detail-dialog">
  <button class="dialog-close" aria-label="닫기">×</button>
  <div id="detail-content"></div>
</dialog>

<dialog id="contact-dialog">
  <form id="contact-form" method="dialog">
    <h3>연수 · 강의 · 협업 문의</h3>
    <label>성함 <input type="text" name="name" maxlength="40" required></label>
    <label>연락받으실 곳 (이메일 또는 전화)
      <input type="text" name="contact" maxlength="120" required placeholder="hong@school.kr">
    </label>
    <label>내용
      <textarea name="message" rows="6" maxlength="2000" required placeholder="소속과 문의 내용을 적어 주세요."></textarea>
    </label>
    <!-- 봇 감지용. 사람 눈에는 보이지 않으므로 채워져 오면 자동 제출로 본다. -->
    <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p id="contact-msg" class="message"></p>
    <div class="contact-actions">
      <button type="button" id="contact-cancel">취소</button>
      <button type="submit" id="contact-send">보내기</button>
    </div>
  </form>
</dialog>

<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "56148f77f2cb4b55838418b6b94746f0"}'></script>
<script src="js/categories.js"></script>
<script src="js/screenshots.js"></script>
<script src="js/main.js"></script>
</body>
</html>
