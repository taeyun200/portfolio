<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="기기를 쓰지 않는 종이 단계에서 질문을 확정하고, 확정 질문만 웹 학습지로 넘어가 다른 학생의 질문으로 글을 쓴다. 선택된 횟수는 가점으로 돌아가고, 쓴 과정은 확인 면접으로 넘어가 글을 보지 않고 설명한다.">
  <style>
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #4f252e; stroke-width: 1.3; }
    .key  { fill: #fff7c5; stroke: #f4ae52; stroke-width: 2.4; }
    .ghost { fill: none; stroke: #8b6068; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #c1ebe9; }
    .zone { fill: #fffaf0; stroke: #8b6068; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8b6068; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #4f252e; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #f4ae52; stroke-width: 2.4; fill: none; }
    .no   { stroke: #8b6068; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #b35c0f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #f4ae52; }
    .node { fill: #4f252e; }
    .t  { fill: #4f252e; font-size: 14px; font-weight: 700; }
    .tb { fill: #4f252e; font-size: 16px; font-weight: 700; }
    .s  { fill: #8b6068; font-size: 12px; }
    .c  { fill: #4f252e; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #8b6068; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #8b6068; font-size: 10.5px; }
    .al { fill: #b35c0f; font-size: 12px; font-weight: 600;
          paint-order: stroke; stroke: #fdf4e4; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #32191f; stroke: #f8ece1; }
      .key  { fill: #4a3a1e; }
      .ghost, .zone, .ring, .no { stroke: #c6a29e; }
      .chip { fill: #1d5a5c; }
      .zone { fill: #2f171c; }
      .ln   { stroke: #f8ece1; }
      .x    { stroke: #f4ae52; }
      .node { fill: #f8ece1; }
      .t, .tb, .c { fill: #f8ece1; }
      .s, .zl, .rl { fill: #c6a29e; }
      .al { fill: #f4ae52; stroke: #2c151a; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="8" y="22" width="206" height="206" rx="14" class="zone"/><text x="22" y="41" text-anchor="start" class="zl">종이 · 기기 없음</text>
  <rect x="236" y="22" width="268" height="206" rx="14" class="zone"/><text x="250" y="41" text-anchor="start" class="zl">웹 학습지</text>
  <rect x="526" y="22" width="186" height="206" rx="14" class="zone"/><text x="540" y="41" text-anchor="start" class="zl">확인 면접</text>
  <rect x="24" y="56" width="174" height="96" rx="12" class="box"/><text x="111" y="91" text-anchor="middle" class="t">질문 만들기</text><text x="111" y="112" text-anchor="middle" class="s">교과서 읽기 → 개념어</text><text x="111" y="130" text-anchor="middle" class="s">→ 쟁점 → 질문 확정</text>
  <rect x="24" y="172" width="174" height="40" rx="12" class="box"/><text x="111" y="197" text-anchor="middle" class="t">선택된 만큼 가점</text>
  <rect x="252" y="56" width="236" height="156" rx="14" class="key"/><text x="370" y="103" text-anchor="middle" class="tb">다른 학생 질문으로 쓰기</text><text x="370" y="124" text-anchor="middle" class="s">질문 고르기 · 예상 답</text><text x="370" y="142" text-anchor="middle" class="s">근거 · 개요 · 논술</text><text x="370" y="160" text-anchor="middle" class="s">처음 쓴 답은 따로 저장</text><text x="370" y="178" text-anchor="middle" class="s">붙여넣기 막음 · 30초 기록</text>
  <rect x="542" y="56" width="154" height="100" rx="12" class="box"/><text x="619" y="93" text-anchor="middle" class="t">5~10분 면접</text><text x="619" y="114" text-anchor="middle" class="s">글을 보지 않고</text><text x="619" y="132" text-anchor="middle" class="s">자기 말로 설명</text>
  <path d="M619 158 V170" class="ln"/>
  <rect x="542" y="172" width="154" height="40" rx="12" class="box"/><text x="619" y="197" text-anchor="middle" class="t">일치·부분·불일치</text>
  <path d="M200 90 H250" class="arw" marker-end="url(#h)"/>
  <text x="225" y="80" text-anchor="middle" class="al">확정 질문만</text>
  <path d="M250 192 H200" class="arw" marker-end="url(#h)"/>
  <text x="225" y="214" text-anchor="middle" class="al">선택 횟수</text>
  <path d="M490 106 H540" class="arw" marker-end="url(#h)"/>
  <text x="515" y="96" text-anchor="middle" class="al">쓴 과정</text>
</svg>
