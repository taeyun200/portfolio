<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="해마다 형식이 다른 4년치 문서와, 잠겨 있어 그림으로 뽑아 옮겨 적은 한 해 244건을 모아 서버에 질의응답 909건으로 둔다. 방문자 화면은 검색어만 보내고 비슷한 결과만 받는다.">
  <style>
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #4f252e; stroke-width: 1.3; }
    .key  { fill: #fff7c5; stroke: #f4ae52; stroke-width: 2.4; }
    .ghost { fill: none; stroke: #8b6068; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #c1ebe9; }
    .zone { fill: #fffaf0; stroke: #8b6068; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8b6068; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #4f252e; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #f4ae52; stroke-width: 2.4; fill: none; }
    .no   { stroke: #8b6068; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #b35c0f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #f4ae52; }
    .node { fill: #4f252e; }
    .t  { fill: #4f252e; font-size: 14px; font-weight: 700; }
    .tb { fill: #4f252e; font-size: 16px; font-weight: 700; }
    .s  { fill: #8b6068; font-size: 12px; }
    .c  { fill: #4f252e; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #8b6068; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #8b6068; font-size: 10.5px; }
    .al { fill: #b35c0f; font-size: 12px; font-weight: 600;
          paint-order: stroke; stroke: #fdf4e4; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #32191f; stroke: #f8ece1; }
      .key  { fill: #4a3a1e; }
      .ghost, .zone, .ring, .no { stroke: #c6a29e; }
      .chip { fill: #1d5a5c; }
      .zone { fill: #2f171c; }
      .ln   { stroke: #f8ece1; }
      .x    { stroke: #f4ae52; }
      .node { fill: #f8ece1; }
      .t, .tb, .c { fill: #f8ece1; }
      .s, .zl, .rl { fill: #c6a29e; }
      .al { fill: #f4ae52; stroke: #2c151a; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="8" y="22" width="214" height="206" rx="14" class="zone"/><text x="22" y="41" text-anchor="start" class="zl">준비 · 내 PC</text>
  <rect x="246" y="22" width="230" height="206" rx="14" class="zone"/><text x="260" y="41" text-anchor="start" class="zl">서버</text>
  <rect x="500" y="22" width="212" height="206" rx="14" class="zone"/><text x="514" y="41" text-anchor="start" class="zl">방문자 화면</text>
  <rect x="24" y="56" width="182" height="62" rx="12" class="box"/><text x="115" y="83" text-anchor="middle" class="t">4년치 문서</text><text x="115" y="104" text-anchor="middle" class="s">해마다 형식이 다름</text>
  <rect x="24" y="134" width="182" height="76" rx="12" class="box"/><text x="115" y="159" text-anchor="middle" class="t">잠긴 한 해</text><text x="115" y="180" text-anchor="middle" class="s">그림으로 뽑아 옮겨 적음</text><text x="115" y="198" text-anchor="middle" class="s">244건</text>
  <path d="M208 87 C 234 87, 236 100, 260 102" class="arw" marker-end="url(#h)"/>
  <path d="M208 172 C 234 172, 236 158, 260 156" class="arw" marker-end="url(#h)"/>
  <rect x="262" y="56" width="198" height="152" rx="14" class="key"/><text x="361" y="110" text-anchor="middle" class="tb">질의응답 909건</text><text x="361" y="131" text-anchor="middle" class="s">분류 이름은 하나로</text><text x="361" y="149" text-anchor="middle" class="s">원래 표기도 함께</text><text x="361" y="167" text-anchor="middle" class="s">뜻이 비슷하면 찾음</text>
  <rect x="516" y="56" width="180" height="72" rx="12" class="box"/><text x="606" y="88" text-anchor="middle" class="t">검색</text><text x="606" y="109" text-anchor="middle" class="s">'면접 준비'</text>
  <rect x="516" y="146" width="180" height="62" rx="12" class="box"/><text x="606" y="173" text-anchor="middle" class="t">비슷한 질문들</text><text x="606" y="194" text-anchor="middle" class="s">통째로는 못 가져감</text>
  <path d="M514 92 H462" class="arw" marker-end="url(#h)"/>
  <text x="488" y="80" text-anchor="middle" class="al">검색어만</text>
  <path d="M462 177 H514" class="arw" marker-end="url(#h)"/>
  <text x="488" y="200" text-anchor="middle" class="al">결과만</text>
</svg>
