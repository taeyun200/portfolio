<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img"
     aria-label="준비하는 사람의 컴퓨터에서 학교 문서를 글자로 되살리고, 사람이 전문을 읽고 승인한 본문만 연수 서버에 한 번에 올린다. 선생님들은 코드와 이름으로 들어와 같은 생기부에 밑줄과 평가를 남기고, 진행자는 같은 화면에서 모두의 밑줄과 의견, 누가 어디까지 읽었는지를 본다.">
  <style>
    text { font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #1d1a17; stroke-width: 1.3; }
    .key  { fill: #fdf0e6; stroke: #c9561c; stroke-width: 2.2; }
    .ghost { fill: none; stroke: #6f6860; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #ebe6de; }
    .zone { fill: #faf8f4; stroke: #8a837a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8a837a; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #1d1a17; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #c9561c; stroke-width: 2.2; fill: none; }
    .no   { stroke: #8a837a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #a9460f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #c9561c; }
    .node { fill: #1d1a17; }
    .t  { fill: #1d1a17; font-size: 14px; font-weight: 700; }
    .tb { fill: #1d1a17; font-size: 16px; font-weight: 800; }
    .s  { fill: #6f6860; font-size: 12px; }
    .c  { fill: #1d1a17; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #6f6860; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #6f6860; font-size: 10.5px; }
    .al { fill: #a9460f; font-size: 12px; font-weight: 700;
          paint-order: stroke; stroke: #f5f2ec; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #262220; stroke: #f1ece6; }
      .key  { fill: #3a2618; stroke: #f08a4b; }
      .ghost, .zone, .ring, .no { stroke: #a79f95; }
      .chip { fill: #2d2824; }
      .zone { fill: #1f1b18; }
      .ln   { stroke: #f1ece6; }
      .arw  { stroke: #f08a4b; }
      .dot  { fill: #f08a4b; }
      .x    { stroke: #f39a62; }
      .node { fill: #f1ece6; }
      .t, .tb, .c { fill: #f1ece6; }
      .s, .zl, .rl { fill: #a79f95; }
      .al { fill: #f39a62; stroke: #221e1b; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="8" y="22" width="220" height="230" rx="14" class="zone"/><text x="22" y="41" text-anchor="start" class="zl">준비 컴퓨터 — 원본은 여기만</text>
  <rect x="24" y="52" width="188" height="52" rx="12" class="box"/><text x="118" y="74" text-anchor="middle" class="t">생기부 문서</text><text x="118" y="95" text-anchor="middle" class="s">학교 시스템에서 출력</text>
  <rect x="24" y="116" width="188" height="52" rx="12" class="box"/><text x="118" y="138" text-anchor="middle" class="t">글자로 되살리기</text><text x="118" y="159" text-anchor="middle" class="s">그림 글자 → 글자</text>
  <rect x="24" y="180" width="188" height="58" rx="14" class="key"/><text x="118" y="205" text-anchor="middle" class="tb">사람이 읽고 승인</text><text x="118" y="226" text-anchor="middle" class="s">이름 · 생년월일은 안 뽑음</text>
  <rect x="250" y="22" width="220" height="230" rx="14" class="zone"/><text x="264" y="41" text-anchor="start" class="zl">연수 서버</text>
  <rect x="266" y="88" width="188" height="70" rx="12" class="box"/><text x="360" y="110" text-anchor="middle" class="t">연수 자료</text><text x="360" y="131" text-anchor="middle" class="s">승인한 본문</text><text x="360" y="149" text-anchor="middle" class="s">밑줄 · 평가 · 의견</text>
  <rect x="266" y="170" width="188" height="32" rx="16" class="chip"/><text x="360" y="190.5" text-anchor="middle" class="c">준비 → 진행 → 종료</text>
  <rect x="492" y="22" width="220" height="230" rx="14" class="zone"/><text x="506" y="41" text-anchor="start" class="zl">연수 화면</text>
  <rect x="508" y="69" width="188" height="70" rx="12" class="box"/><text x="602" y="91" text-anchor="middle" class="t">선생님</text><text x="602" y="112" text-anchor="middle" class="s">같은 생기부에 밑줄 · 평가</text><text x="602" y="130" text-anchor="middle" class="s">각자 먼저 → 모아 보기</text>
  <rect x="508" y="151" width="188" height="70" rx="12" class="box"/><text x="602" y="173" text-anchor="middle" class="t">진행자</text><text x="602" y="194" text-anchor="middle" class="s">누가 어디까지 읽었나</text><text x="602" y="212" text-anchor="middle" class="s">모두의 밑줄 · 의견</text>
  <path d="M118 106 V114" class="ln"/>
  <path d="M118 170 V178" class="ln"/>
  <path d="M214 209 C 236.5 209, 241.5 123, 264 123" class="arw" marker-end="url(#h)"/>
  <text x="239" y="158" text-anchor="middle" class="al">승인한 것만 한 번에</text>
  <path d="M456 123 C 478.5 123, 483.5 104, 506 104" class="arw" marker-end="url(#h)"/>
  <text x="481" y="105.5" text-anchor="middle" class="al">코드 + 이름</text>
  <path d="M456 123 C 478.5 123, 483.5 186, 506 186" class="arw" marker-end="url(#h)"/>
  <text x="481" y="146.5" text-anchor="middle" class="al">비밀번호</text>
</svg>
