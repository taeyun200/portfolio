<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="준비하는 사람의 PC에서 학교 문서를 글자로 읽고 영역별로 뽑은 뒤, 사람이 전문을 읽고 승인한 것만 연수용 서버로 올린다. 참가 교사는 코드와 이름으로 들어와 같이 읽고, 여럿이 멈춘 자리는 밑줄이 굵어진다.">
  <style>
    text { font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #1d1a17; stroke-width: 1.3; }
    .key  { fill: #fdf0e6; stroke: #c9561c; stroke-width: 2.2; }
    .ghost { fill: none; stroke: #6f6860; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #ebe6de; }
    .zone { fill: #faf8f4; stroke: #8a837a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8a837a; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #1d1a17; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #c9561c; stroke-width: 2.2; fill: none; }
    .no   { stroke: #8a837a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #a9460f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #c9561c; }
    .node { fill: #1d1a17; }
    .t  { fill: #1d1a17; font-size: 14px; font-weight: 700; }
    .tb { fill: #1d1a17; font-size: 16px; font-weight: 800; }
    .s  { fill: #6f6860; font-size: 12px; }
    .c  { fill: #1d1a17; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #6f6860; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #6f6860; font-size: 10.5px; }
    .al { fill: #a9460f; font-size: 12px; font-weight: 700;
          paint-order: stroke; stroke: #f5f2ec; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #262220; stroke: #f1ece6; }
      .key  { fill: #3a2618; stroke: #f08a4b; }
      .ghost, .zone, .ring, .no { stroke: #a79f95; }
      .chip { fill: #2d2824; }
      .zone { fill: #1f1b18; }
      .ln   { stroke: #f1ece6; }
      .arw  { stroke: #f08a4b; }
      .dot  { fill: #f08a4b; }
      .x    { stroke: #f39a62; }
      .node { fill: #f1ece6; }
      .t, .tb, .c { fill: #f1ece6; }
      .s, .zl, .rl { fill: #a79f95; }
      .al { fill: #f39a62; stroke: #221e1b; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="8" y="22" width="300" height="206" rx="14" class="zone"/><text x="22" y="41" text-anchor="start" class="zl">준비하는 사람의 PC — 원본은 여기만</text>
  <rect x="330" y="22" width="170" height="206" rx="14" class="zone"/><text x="344" y="41" text-anchor="start" class="zl">연수용 서버</text>
  <rect x="522" y="22" width="190" height="206" rx="14" class="zone"/><text x="536" y="41" text-anchor="start" class="zl">연수 참가 교사</text>
  <rect x="24" y="56" width="126" height="64" rx="12" class="box"/><text x="87" y="84" text-anchor="middle" class="t">생기부 문서</text><text x="87" y="105" text-anchor="middle" class="s">학교 시스템 출력</text>
  <path d="M152 88 H162" class="arw" marker-end="url(#h)"/>
  <rect x="166" y="56" width="126" height="64" rx="12" class="box"/><text x="229" y="84" text-anchor="middle" class="t">글자로 읽기</text><text x="229" y="105" text-anchor="middle" class="s">그림 글자 → 글자</text>
  <path d="M229 122 V142" class="arw" marker-end="url(#h)"/>
  <rect x="24" y="146" width="268" height="66" rx="14" class="key"/><text x="158" y="175" text-anchor="middle" class="tb">사람이 전문 읽고 승인</text><text x="158" y="196" text-anchor="middle" class="s">이름·생년월일은 처음부터 안 뽑음</text>
  <rect x="346" y="110" width="138" height="70" rx="12" class="box"/><text x="415" y="141" text-anchor="middle" class="t">연수 자료</text><text x="415" y="162" text-anchor="middle" class="s">학교명은 기호로</text>
  <path d="M294 179 C 318 179, 322 150, 344 148" class="arw" marker-end="url(#h)"/>
  <text x="318" y="206" text-anchor="middle" class="al">승인한 것만</text>
  <rect x="538" y="56" width="158" height="78" rx="12" class="box"/><text x="617" y="91" text-anchor="middle" class="t">같이 읽기</text><text x="617" y="112" text-anchor="middle" class="s">각자 먼저 → 같이 보기</text>
  <path d="M617 136 V148" class="ln"/>
  <rect x="538" y="150" width="158" height="60" rx="12" class="box"/><text x="617" y="176" text-anchor="middle" class="t">밑줄이 굵어짐</text><text x="617" y="197" text-anchor="middle" class="s">여럿이 멈춘 자리</text>
  <path d="M486 136 C 510 136, 512 96, 536 96" class="arw" marker-start="url(#h)" marker-end="url(#h)"/>
  <text x="511" y="78" text-anchor="middle" class="al">코드 + 이름</text>
</svg>
