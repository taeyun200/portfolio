<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="교직원 브라우저의 학교 화면은 학교 구글 계정의 표 문서와 읽고 적는다. 캡처는 바깥 글자 읽기 서비스에 다녀오며 명단만 돌아오고, 확인 화면에서 반영을 누를 때만 표 문서에 들어간다.">
  <style>
    text { font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #1d1a17; stroke-width: 1.3; }
    .key  { fill: #fdf0e6; stroke: #c9561c; stroke-width: 2.2; }
    .ghost { fill: none; stroke: #6f6860; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #ebe6de; }
    .zone { fill: #faf8f4; stroke: #8a837a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8a837a; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #1d1a17; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #c9561c; stroke-width: 2.2; fill: none; }
    .no   { stroke: #8a837a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #a9460f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #c9561c; }
    .node { fill: #1d1a17; }
    .t  { fill: #1d1a17; font-size: 14px; font-weight: 700; }
    .tb { fill: #1d1a17; font-size: 16px; font-weight: 800; }
    .s  { fill: #6f6860; font-size: 12px; }
    .c  { fill: #1d1a17; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #6f6860; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #6f6860; font-size: 10.5px; }
    .al { fill: #a9460f; font-size: 12px; font-weight: 700;
          paint-order: stroke; stroke: #f5f2ec; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #262220; stroke: #f1ece6; }
      .key  { fill: #3a2618; stroke: #f08a4b; }
      .ghost, .zone, .ring, .no { stroke: #a79f95; }
      .chip { fill: #2d2824; }
      .zone { fill: #1f1b18; }
      .ln   { stroke: #f1ece6; }
      .arw  { stroke: #f08a4b; }
      .dot  { fill: #f08a4b; }
      .x    { stroke: #f39a62; }
      .node { fill: #f1ece6; }
      .t, .tb, .c { fill: #f1ece6; }
      .s, .zl, .rl { fill: #a79f95; }
      .al { fill: #f39a62; stroke: #221e1b; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="8" y="22" width="176" height="206" rx="14" class="zone"/><text x="22" y="41" text-anchor="start" class="zl">바깥 서비스</text>
  <rect x="214" y="22" width="258" height="206" rx="14" class="zone"/><text x="228" y="41" text-anchor="start" class="zl">교직원 브라우저</text>
  <rect x="502" y="22" width="210" height="206" rx="14" class="zone"/><text x="516" y="41" text-anchor="start" class="zl">학교 구글 계정</text>
  <rect x="26" y="104" width="140" height="64" rx="12" class="box"/><text x="96" y="132" text-anchor="middle" class="t">글자 읽기</text><text x="96" y="153" text-anchor="middle" class="s">캡처 속 명단</text>
  <rect x="238" y="56" width="210" height="74" rx="14" class="key"/><text x="343" y="89" text-anchor="middle" class="tb">학교 화면</text><text x="343" y="110" text-anchor="middle" class="s">로그인해야 열림</text>
  <rect x="238" y="162" width="210" height="44" rx="12" class="box"/><text x="343" y="189" text-anchor="middle" class="t">확인하고 '반영'</text>
  <rect x="522" y="56" width="170" height="74" rx="12" class="box"/><text x="607" y="89" text-anchor="middle" class="t">표 문서</text><text x="607" y="110" text-anchor="middle" class="s">업무 · 명단 · 기록</text>
  <rect x="522" y="146" width="170" height="60" rx="12" class="box"/><text x="607" y="172" text-anchor="middle" class="t">맡은 일</text><text x="607" y="193" text-anchor="middle" class="s">기숙사 · 자율학습 · 공가</text>
  <path d="M236 106 C 205 106, 200 122, 168 126" class="arw" marker-end="url(#h)"/>
  <text x="200" y="98" text-anchor="middle" class="al">캡처</text>
  <path d="M168 150 C 200 156, 205 184, 236 184" class="arw" marker-end="url(#h)"/>
  <text x="196" y="214" text-anchor="middle" class="al">명단만</text>
  <path d="M450 84 H520" class="arw" marker-start="url(#h)" marker-end="url(#h)"/>
  <text x="485" y="76" text-anchor="middle" class="al">읽고 적음</text>
  <path d="M450 184 C 480 184, 486 124, 520 118" class="arw" marker-end="url(#h)"/>
  <text x="478" y="214" text-anchor="middle" class="al">누를 때만</text>
</svg>
