<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 224" role="img"
     aria-label="대학마다 낸 2028 시행계획 원문을 읽어 인원과 평가방법을 정리하고, 두 갈래로 다시 세어 맞는 것만 기억창고에 넣는다. 사이트는 사람 확인을 거친 요청에 한 대학씩만 보여 주고, 자료를 통째로 내려받는 길은 막아 둔다.">
  <style>
    text { font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #1d1a17; stroke-width: 1.3; }
    .key  { fill: #fdf0e6; stroke: #c9561c; stroke-width: 2.2; }
    .ghost { fill: none; stroke: #6f6860; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #ebe6de; }
    .zone { fill: #faf8f4; stroke: #8a837a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8a837a; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #1d1a17; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #c9561c; stroke-width: 2.2; fill: none; }
    .no   { stroke: #8a837a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #a9460f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #c9561c; }
    .node { fill: #1d1a17; }
    .t  { fill: #1d1a17; font-size: 14px; font-weight: 700; }
    .tb { fill: #1d1a17; font-size: 16px; font-weight: 800; }
    .s  { fill: #6f6860; font-size: 12px; }
    .c  { fill: #1d1a17; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #6f6860; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #6f6860; font-size: 10.5px; }
    .al { fill: #a9460f; font-size: 12px; font-weight: 700;
          paint-order: stroke; stroke: #f5f2ec; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #262220; stroke: #f1ece6; }
      .key  { fill: #3a2618; stroke: #f08a4b; }
      .ghost, .zone, .ring, .no { stroke: #a79f95; }
      .chip { fill: #2d2824; }
      .zone { fill: #1f1b18; }
      .ln   { stroke: #f1ece6; }
      .arw  { stroke: #f08a4b; }
      .dot  { fill: #f08a4b; }
      .x    { stroke: #f39a62; }
      .node { fill: #f1ece6; }
      .t, .tb, .c { fill: #f1ece6; }
      .s, .zl, .rl { fill: #a79f95; }
      .al { fill: #f39a62; stroke: #221e1b; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="8" y="22" width="159.5" height="194" rx="14" class="zone"/><text x="22" y="41" text-anchor="start" class="zl">대학이 낸 자료</text>
  <rect x="24" y="92" width="127.5" height="70" rx="12" class="box"/><text x="87.75" y="114" text-anchor="middle" class="t">시행계획 원문</text><text x="87.75" y="135" text-anchor="middle" class="s">대학마다 수십 쪽</text><text x="87.75" y="153" text-anchor="middle" class="s">표와 글 섞인 문서</text>
  <rect x="189.5" y="22" width="159.5" height="194" rx="14" class="zone"/><text x="203.5" y="41" text-anchor="start" class="zl">정리하는 컴퓨터</text>
  <rect x="205.5" y="67" width="127.5" height="76" rx="14" class="key"/><text x="269.25" y="92" text-anchor="middle" class="tb">원문 읽고 정리</text><text x="269.25" y="113" text-anchor="middle" class="s">인원 · 평가방법</text><text x="269.25" y="131" text-anchor="middle" class="s">쪽 번호도 적기</text>
  <rect x="205.5" y="155" width="127.5" height="32" rx="16" class="chip"/><text x="269.25" y="175.5" text-anchor="middle" class="c">두 번 세어 확인</text>
  <rect x="371" y="22" width="159.5" height="194" rx="14" class="zone"/><text x="385" y="41" text-anchor="start" class="zl">인터넷 기억창고</text>
  <rect x="387" y="92" width="127.5" height="70" rx="12" class="box"/><text x="450.75" y="114" text-anchor="middle" class="t">입시 기억창고</text><text x="450.75" y="135" text-anchor="middle" class="s">2028 · 2027 인원</text><text x="450.75" y="153" text-anchor="middle" class="s">전형별 평가방법</text>
  <rect x="552.5" y="22" width="159.5" height="194" rx="14" class="zone"/><text x="566.5" y="41" text-anchor="start" class="zl">누구나 여는 사이트</text>
  <rect x="568.5" y="64" width="127.5" height="70" rx="12" class="box"/><text x="632.25" y="86" text-anchor="middle" class="t">2028 한 페이지</text><text x="632.25" y="107" text-anchor="middle" class="s">대학마다 한 화면</text><text x="632.25" y="125" text-anchor="middle" class="s">조건으로 전형 찾기</text>
  <rect x="568.5" y="146" width="127.5" height="44" rx="12" class="ghost"/><text x="632.25" y="173" text-anchor="middle" class="t">통째로 내려받기</text>
  <path d="M153.5 127 C 176 127, 181 105, 203.5 105" class="arw" marker-end="url(#h)"/>
  <text x="178.5" y="108" text-anchor="middle" class="al">원문대로</text>
  <path d="M335 105 C 357.5 105, 362.5 127, 385 127" class="arw" marker-end="url(#h)"/>
  <text x="360" y="108" text-anchor="middle" class="al">맞는 것만</text>
  <path d="M269.25 153 V145" class="ln"/>
  <path d="M516.5 127 C 539 127, 544 99, 566.5 99" class="arw" marker-end="url(#h)"/>
  <text x="541.5" y="105" text-anchor="middle" class="al">한 곳씩</text>
  <path d="M632.25 136 V144" class="no"/>
  <path d="M626.25 134 L638.25 146 M638.25 134 L626.25 146" class="x"/>
</svg>
