<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 246" role="img"
     aria-label="흩어진 대학 공시자료를 파이썬으로 수집·정제해 하나의 진학지도용 데이터베이스로 모으고 조회하는 구조">
  <style>
    .bx { fill: #ffffff; stroke: #4f252e; stroke-width: 1.4; }
    .safe { fill: #c1ebe9; stroke: #4f252e; stroke-width: 1.4; }
    .lbl { font-size: 15px; font-weight: 700; fill: #4f252e; }
    .sub { font-size: 12.5px; fill: #8b6068; }
    .flow { font-size: 12.5px; font-weight: 700; fill: #4f252e; }
    .arw { stroke: #f4ae52; stroke-width: 2.6; fill: none; }
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bx { fill: #3b1f26; stroke: #f3ddd2; }
      .safe { fill: #1d5a5c; stroke: #f3ddd2; }
      .lbl, .flow { fill: #f8ece1; }
      .sub { fill: #c6a29e; }
    }
  </style>
  <defs>
    <marker id="i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f4ae52" />
    </marker>
  </defs>

  <rect x="0" y="14" width="152" height="38" rx="8" class="bx" />
  <text x="76" y="38" text-anchor="middle" class="sub">세부전형별 모집인원</text>

  <rect x="0" y="60" width="152" height="38" rx="8" class="bx" />
  <text x="76" y="84" text-anchor="middle" class="sub">경쟁률 · 충원률</text>

  <rect x="0" y="106" width="152" height="38" rx="8" class="bx" />
  <text x="76" y="130" text-anchor="middle" class="sub">‘어디가’ 기준점수</text>

  <text x="0" y="166" class="sub">해마다 갱신되고</text>
  <text x="0" y="184" class="sub">대학·전형마다 형식이 다름</text>

  <path d="M158 33 C 190 33, 190 79, 218 79" class="arw" marker-end="url(#i)" />
  <path d="M158 79 H218" class="arw" marker-end="url(#i)" />
  <path d="M158 125 C 190 125, 190 79, 218 79" class="arw" marker-end="url(#i)" />

  <rect x="228" y="40" width="150" height="78" rx="10" class="safe" />
  <text x="303" y="68" text-anchor="middle" class="lbl">수집 · 정제</text>
  <text x="303" y="90" text-anchor="middle" class="sub">Python 스크립트</text>
  <text x="303" y="108" text-anchor="middle" class="sub">형식 통일 · 대학명 정규화</text>

  <path d="M384 79 H436" class="arw" marker-end="url(#i)" />

  <rect x="446" y="49" width="174" height="60" rx="10" class="bx" />
  <text x="533" y="73" text-anchor="middle" class="lbl">통합 데이터베이스</text>
  <text x="533" y="93" text-anchor="middle" class="sub">전형 단위로 한 줄</text>

  <path d="M533 115 V139" class="arw" marker-end="url(#i)" />

  <rect x="446" y="147" width="174" height="66" rx="10" class="bx" />
  <text x="533" y="171" text-anchor="middle" class="lbl">조회 · 대시보드</text>
  <text x="533" y="191" text-anchor="middle" class="sub">“이 전형, 작년에</text>
  <text x="533" y="207" text-anchor="middle" class="sub">몇 명 뽑고 컷은 얼마”</text>

  <text x="0" y="234" class="sub">상담 중에 자료를 뒤지지 않고 바로 답하기 위한 데이터베이스입니다.</text>
</svg>
