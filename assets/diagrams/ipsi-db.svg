<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="대학마다 흩어진 모집인원·경쟁률·충원률·합격선 발표를 프로그램이 모아 해마다 다른 표 모양을 같은 모양으로 다듬고, 대학·전형·학과별 한 줄로 쌓아 상담 때 바로 찾는다.">
  <style>
    text { font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #1d1a17; stroke-width: 1.3; }
    .key  { fill: #fdf0e6; stroke: #c9561c; stroke-width: 2.2; }
    .ghost { fill: none; stroke: #6f6860; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #ebe6de; }
    .zone { fill: #faf8f4; stroke: #8a837a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8a837a; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #1d1a17; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #c9561c; stroke-width: 2.2; fill: none; }
    .no   { stroke: #8a837a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #a9460f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #c9561c; }
    .node { fill: #1d1a17; }
    .t  { fill: #1d1a17; font-size: 14px; font-weight: 700; }
    .tb { fill: #1d1a17; font-size: 16px; font-weight: 800; }
    .s  { fill: #6f6860; font-size: 12px; }
    .c  { fill: #1d1a17; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #6f6860; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #6f6860; font-size: 10.5px; }
    .al { fill: #a9460f; font-size: 12px; font-weight: 700;
          paint-order: stroke; stroke: #f5f2ec; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #262220; stroke: #f1ece6; }
      .key  { fill: #3a2618; stroke: #f08a4b; }
      .ghost, .zone, .ring, .no { stroke: #a79f95; }
      .chip { fill: #2d2824; }
      .zone { fill: #1f1b18; }
      .ln   { stroke: #f1ece6; }
      .arw  { stroke: #f08a4b; }
      .dot  { fill: #f08a4b; }
      .x    { stroke: #f39a62; }
      .node { fill: #f1ece6; }
      .t, .tb, .c { fill: #f1ece6; }
      .s, .zl, .rl { fill: #a79f95; }
      .al { fill: #f39a62; stroke: #221e1b; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <text x="85" y="22" text-anchor="middle" class="zl">대학마다 흩어진 발표</text>
  <rect x="10" y="34" width="150" height="30" rx="15" class="chip"/><text x="85" y="53.5" text-anchor="middle" class="c">모집인원</text>
  <rect x="10" y="74" width="150" height="30" rx="15" class="chip"/><text x="85" y="93.5" text-anchor="middle" class="c">경쟁률</text>
  <rect x="10" y="114" width="150" height="30" rx="15" class="chip"/><text x="85" y="133.5" text-anchor="middle" class="c">충원률</text>
  <rect x="10" y="154" width="150" height="30" rx="15" class="chip"/><text x="85" y="173.5" text-anchor="middle" class="c">'어디가' 합격선</text>
  <path d="M160 49 C 210 49, 210 120, 250 120" class="ln"/>
  <path d="M160 89 C 205 89, 210 120, 250 120" class="ln"/>
  <path d="M160 129 C 205 129, 210 120, 250 120" class="ln"/>
  <path d="M160 169 C 210 169, 210 120, 250 120" class="ln"/>
  <rect x="252" y="70" width="200" height="100" rx="14" class="key"/><text x="352" y="107" text-anchor="middle" class="tb">같은 모양으로 다듬기</text><text x="352" y="128" text-anchor="middle" class="s">해마다 표 모양이 달라도</text><text x="352" y="146" text-anchor="middle" class="s">값은 같은 자리에</text>
  <path d="M454 120 H494" class="arw" marker-end="url(#h)"/>
  <text x="474" y="110" text-anchor="middle" class="al">쌓기</text>
  <rect x="498" y="78" width="212" height="84" rx="12" class="box"/><text x="604" y="107" text-anchor="middle" class="t">자료창고</text><text x="604" y="128" text-anchor="middle" class="s">대학 · 전형 · 학과별 한 줄</text><text x="604" y="146" text-anchor="middle" class="s">상담 때 바로 찾기</text>
</svg>
