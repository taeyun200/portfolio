<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="원점수·답안·정답표 등 여섯 장의 표를 채우고 회차와 채점 방식을 고르면 문항별 정답률, 수능최저 충족과 유리한 조합, 학생 상담 리포트, 개인 성적표가 버튼 한 번으로 나온다. 다른 학교용으로 가짜 학생 틀과 설명서를 따로 둔다.">
  <style>
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #4f252e; stroke-width: 1.3; }
    .key  { fill: #fff7c5; stroke: #f4ae52; stroke-width: 2.4; }
    .ghost { fill: none; stroke: #8b6068; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #c1ebe9; }
    .zone { fill: #fffaf0; stroke: #8b6068; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8b6068; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #4f252e; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #f4ae52; stroke-width: 2.4; fill: none; }
    .no   { stroke: #8b6068; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #b35c0f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #f4ae52; }
    .node { fill: #4f252e; }
    .t  { fill: #4f252e; font-size: 14px; font-weight: 700; }
    .tb { fill: #4f252e; font-size: 16px; font-weight: 700; }
    .s  { fill: #8b6068; font-size: 12px; }
    .c  { fill: #4f252e; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #8b6068; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #8b6068; font-size: 10.5px; }
    .al { fill: #b35c0f; font-size: 12px; font-weight: 600;
          paint-order: stroke; stroke: #fdf4e4; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #32191f; stroke: #f8ece1; }
      .key  { fill: #4a3a1e; }
      .ghost, .zone, .ring, .no { stroke: #c6a29e; }
      .chip { fill: #1d5a5c; }
      .zone { fill: #2f171c; }
      .ln   { stroke: #f8ece1; }
      .x    { stroke: #f4ae52; }
      .node { fill: #f8ece1; }
      .t, .tb, .c { fill: #f8ece1; }
      .s, .zl, .rl { fill: #c6a29e; }
      .al { fill: #f4ae52; stroke: #2c151a; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="10" y="56" width="170" height="128" rx="12" class="box"/><text x="95" y="98" text-anchor="middle" class="t">여섯 장의 표</text><text x="95" y="119" text-anchor="middle" class="s">원점수 · 답안</text><text x="95" y="137" text-anchor="middle" class="s">정답표 · 배점</text><text x="95" y="155" text-anchor="middle" class="s">전국 성적 분포</text>
  <path d="M182 120 H222" class="arw" marker-end="url(#h)"/>
  <text x="202" y="110" text-anchor="middle" class="al">채우기만</text>
  <rect x="226" y="66" width="196" height="108" rx="14" class="key"/><text x="324" y="107" text-anchor="middle" class="tb">회차 · 채점 방식</text><text x="324" y="128" text-anchor="middle" class="s">고르면 전부 새로 그림</text><text x="324" y="146" text-anchor="middle" class="s">시험 직후 · 공식 답 둘 다</text>
  <text x="600" y="26" text-anchor="middle" class="zl">버튼 한 번으로</text>
  <path d="M424 120 C 460 120, 460 55, 490 55" class="ln"/>
  <path d="M424 120 C 460 120, 460 101, 490 101" class="ln"/>
  <path d="M424 120 C 460 120, 460 147, 490 147" class="ln"/>
  <path d="M424 120 C 460 120, 460 193, 490 193" class="ln"/>
  <rect x="490" y="40" width="220" height="30" rx="15" class="chip"/><text x="600" y="59.5" text-anchor="middle" class="c">문항별 정답률 색 표</text>
  <rect x="490" y="86" width="220" height="30" rx="15" class="chip"/><text x="600" y="105.5" text-anchor="middle" class="c">수능최저 충족 · 유리한 조합</text>
  <rect x="490" y="132" width="220" height="30" rx="15" class="chip"/><text x="600" y="151.5" text-anchor="middle" class="c">학생 상담 리포트</text>
  <rect x="490" y="178" width="220" height="30" rx="15" class="chip"/><text x="600" y="197.5" text-anchor="middle" class="c">개인 성적표</text>
  <path d="M324 176 V194" class="no"/>
  <rect x="216" y="196" width="216" height="30" rx="12" class="ghost"/><text x="324" y="216" text-anchor="middle" class="t">다른 학교용 빈 틀 · 설명서</text>
</svg>
