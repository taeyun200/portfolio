<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="대기실 태블릿 숫자판에 휴대폰 뒤 네 자리를 누르면 담당 선생님 구글 계정의 표 문서에 출근 한 줄이 쌓이고, 교무실 현황판이 10초마다 읽어 색으로 보여 준다. 명단과 지각 기준은 표를 고치면 그대로 반영된다.">
  <style>
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #4f252e; stroke-width: 1.3; }
    .key  { fill: #fff7c5; stroke: #f4ae52; stroke-width: 2.4; }
    .ghost { fill: none; stroke: #8b6068; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #c1ebe9; }
    .zone { fill: #fffaf0; stroke: #8b6068; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8b6068; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #4f252e; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #f4ae52; stroke-width: 2.4; fill: none; }
    .no   { stroke: #8b6068; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #b35c0f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #f4ae52; }
    .node { fill: #4f252e; }
    .t  { fill: #4f252e; font-size: 14px; font-weight: 700; }
    .tb { fill: #4f252e; font-size: 16px; font-weight: 700; }
    .s  { fill: #8b6068; font-size: 12px; }
    .c  { fill: #4f252e; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #8b6068; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #8b6068; font-size: 10.5px; }
    .al { fill: #b35c0f; font-size: 12px; font-weight: 600;
          paint-order: stroke; stroke: #fdf4e4; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #32191f; stroke: #f8ece1; }
      .key  { fill: #4a3a1e; }
      .ghost, .zone, .ring, .no { stroke: #c6a29e; }
      .chip { fill: #1d5a5c; }
      .zone { fill: #2f171c; }
      .ln   { stroke: #f8ece1; }
      .x    { stroke: #f4ae52; }
      .node { fill: #f8ece1; }
      .t, .tb, .c { fill: #f8ece1; }
      .s, .zl, .rl { fill: #c6a29e; }
      .al { fill: #f4ae52; stroke: #2c151a; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="8" y="22" width="196" height="206" rx="14" class="zone"/><text x="22" y="41" text-anchor="start" class="zl">대기실 태블릿</text>
  <rect x="226" y="22" width="268" height="206" rx="14" class="zone"/><text x="240" y="41" text-anchor="start" class="zl">담당 선생님의 구글 계정</text>
  <rect x="516" y="22" width="196" height="206" rx="14" class="zone"/><text x="530" y="41" text-anchor="start" class="zl">교무실 현황판</text>
  <rect x="24" y="56" width="164" height="110" rx="14" class="key"/><text x="106" y="98" text-anchor="middle" class="tb">숫자판</text><text x="106" y="119" text-anchor="middle" class="s">휴대폰 뒤 네 자리</text><text x="106" y="137" text-anchor="middle" class="s">초록 화면 3초</text>
  <text x="106" y="192" text-anchor="middle" class="s">같은 번호면 이름 고르기</text>
  <text x="106" y="210" text-anchor="middle" class="s">두 번 눌러도 처음 기록</text>
  <rect x="242" y="56" width="236" height="96" rx="12" class="box"/><text x="360" y="91" text-anchor="middle" class="t">표 문서</text><text x="360" y="112" text-anchor="middle" class="s">명단 · 출근 기록</text><text x="360" y="130" text-anchor="middle" class="s">지각 기준 시각 한 칸</text>
  <path d="M360 154 V166" class="ln"/>
  <rect x="242" y="168" width="236" height="44" rx="12" class="box"/><text x="360" y="195" text-anchor="middle" class="t">표를 고치면 그대로 반영</text>
  <rect x="532" y="56" width="164" height="110" rx="12" class="box"/><text x="614" y="98" text-anchor="middle" class="t">현황판</text><text x="614" y="119" text-anchor="middle" class="s">10초마다 새로</text><text x="614" y="137" text-anchor="middle" class="s">회색 · 주황 · 초록</text>
  <text x="614" y="192" text-anchor="middle" class="s">긴 주소를 아는 사람만</text>
  <path d="M190 104 H240" class="arw" marker-end="url(#h)"/>
  <text x="215" y="94" text-anchor="middle" class="al">출근 한 줄</text>
  <path d="M480 104 H530" class="arw" marker-end="url(#h)"/>
  <text x="505" y="94" text-anchor="middle" class="al">10초마다</text>
</svg>
