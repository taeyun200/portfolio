<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="9등급 시절 선배의 결과와 5등급 재학생의 내신을 '같은 학년에서 위에서 몇 %인가'라는 한 잣대로 옮겨, 비슷한 위치의 선배가 어디에 지원해 붙었는지 비교한다.">
  <style>
    text { font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #1d1a17; stroke-width: 1.3; }
    .key  { fill: #fdf0e6; stroke: #c9561c; stroke-width: 2.2; }
    .ghost { fill: none; stroke: #6f6860; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #ebe6de; }
    .zone { fill: #faf8f4; stroke: #8a837a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8a837a; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #1d1a17; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #c9561c; stroke-width: 2.2; fill: none; }
    .no   { stroke: #8a837a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #a9460f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #c9561c; }
    .node { fill: #1d1a17; }
    .t  { fill: #1d1a17; font-size: 14px; font-weight: 700; }
    .tb { fill: #1d1a17; font-size: 16px; font-weight: 800; }
    .s  { fill: #6f6860; font-size: 12px; }
    .c  { fill: #1d1a17; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #6f6860; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #6f6860; font-size: 10.5px; }
    .al { fill: #a9460f; font-size: 12px; font-weight: 700;
          paint-order: stroke; stroke: #f5f2ec; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #262220; stroke: #f1ece6; }
      .key  { fill: #3a2618; stroke: #f08a4b; }
      .ghost, .zone, .ring, .no { stroke: #a79f95; }
      .chip { fill: #2d2824; }
      .zone { fill: #1f1b18; }
      .ln   { stroke: #f1ece6; }
      .arw  { stroke: #f08a4b; }
      .dot  { fill: #f08a4b; }
      .x    { stroke: #f39a62; }
      .node { fill: #f1ece6; }
      .t, .tb, .c { fill: #f1ece6; }
      .s, .zl, .rl { fill: #a79f95; }
      .al { fill: #f39a62; stroke: #221e1b; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="10" y="40" width="190" height="70" rx="12" class="box"/><text x="105" y="71" text-anchor="middle" class="t">9등급 시절 선배</text><text x="105" y="92" text-anchor="middle" class="s">지원 · 합격 결과</text>
  <rect x="10" y="130" width="190" height="70" rx="12" class="box"/><text x="105" y="161" text-anchor="middle" class="t">5등급 재학생</text><text x="105" y="182" text-anchor="middle" class="s">지금 내신</text>
  <path d="M202 75 C 240 75, 244 106, 272 108" class="arw" marker-end="url(#h)"/>
  <path d="M202 165 C 240 165, 244 134, 272 132" class="arw" marker-end="url(#h)"/>
  <rect x="276" y="70" width="220" height="100" rx="14" class="key"/><text x="386" y="107" text-anchor="middle" class="tb">같은 잣대로</text><text x="386" y="128" text-anchor="middle" class="s">학년에서 위에서 몇 %인가</text><text x="386" y="146" text-anchor="middle" class="s">전 학기 · 수업 시간 수 반영</text>
  <path d="M498 120 H538" class="arw" marker-end="url(#h)"/>
  <text x="518" y="110" text-anchor="middle" class="al">비교</text>
  <rect x="542" y="78" width="170" height="84" rx="12" class="box"/><text x="627" y="116" text-anchor="middle" class="t">비슷한 위치의 선배</text><text x="627" y="137" text-anchor="middle" class="s">어디 지원해 붙었나</text>
</svg>
