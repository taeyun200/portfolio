<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="에듀파인에서 내려받은 예산 파일을 브라우저에 놓으면 그 컴퓨터 안에서 노션용 표로 바뀌고, 합계가 다르면 경고한다. 어디에도 보내지 않고, 사람이 노션으로 가져온다.">
  <style>
    text { font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #1d1a17; stroke-width: 1.3; }
    .key  { fill: #fdf0e6; stroke: #c9561c; stroke-width: 2.2; }
    .ghost { fill: none; stroke: #6f6860; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #ebe6de; }
    .zone { fill: #faf8f4; stroke: #8a837a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8a837a; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #1d1a17; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #c9561c; stroke-width: 2.2; fill: none; }
    .no   { stroke: #8a837a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #a9460f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #c9561c; }
    .node { fill: #1d1a17; }
    .t  { fill: #1d1a17; font-size: 14px; font-weight: 700; }
    .tb { fill: #1d1a17; font-size: 16px; font-weight: 800; }
    .s  { fill: #6f6860; font-size: 12px; }
    .c  { fill: #1d1a17; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #6f6860; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #6f6860; font-size: 10.5px; }
    .al { fill: #a9460f; font-size: 12px; font-weight: 700;
          paint-order: stroke; stroke: #f5f2ec; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #262220; stroke: #f1ece6; }
      .key  { fill: #3a2618; stroke: #f08a4b; }
      .ghost, .zone, .ring, .no { stroke: #a79f95; }
      .chip { fill: #2d2824; }
      .zone { fill: #1f1b18; }
      .ln   { stroke: #f1ece6; }
      .arw  { stroke: #f08a4b; }
      .dot  { fill: #f08a4b; }
      .x    { stroke: #f39a62; }
      .node { fill: #f1ece6; }
      .t, .tb, .c { fill: #f1ece6; }
      .s, .zl, .rl { fill: #a79f95; }
      .al { fill: #f39a62; stroke: #221e1b; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="8" y="22" width="180" height="206" rx="14" class="zone"/><text x="22" y="41" text-anchor="start" class="zl">에듀파인</text>
  <rect x="210" y="22" width="290" height="206" rx="14" class="zone"/><text x="224" y="41" text-anchor="start" class="zl">이 컴퓨터의 브라우저 — 어디에도 안 보냄</text>
  <rect x="522" y="22" width="190" height="206" rx="14" class="zone"/><text x="536" y="41" text-anchor="start" class="zl">노션</text>
  <rect x="24" y="70" width="148" height="96" rx="12" class="box"/><text x="98" y="105" text-anchor="middle" class="t">예산 파일</text><text x="98" y="126" text-anchor="middle" class="s">집행 · 품의 목록</text><text x="98" y="144" text-anchor="middle" class="s">내려받기</text>
  <rect x="226" y="56" width="258" height="104" rx="14" class="key"/><text x="355" y="95" text-anchor="middle" class="tb">노션용 표로 바꾸기</text><text x="355" y="116" text-anchor="middle" class="s">가져올 사업 고르기</text><text x="355" y="134" text-anchor="middle" class="s">예산액만 · 이미 쓴 돈 따로</text>
  <path d="M355 162 V172" class="ln"/>
  <rect x="226" y="174" width="258" height="40" rx="12" class="box"/><text x="355" y="199" text-anchor="middle" class="t">합계가 다르면 경고</text>
  <rect x="538" y="70" width="158" height="96" rx="12" class="box"/><text x="617" y="105" text-anchor="middle" class="t">부서 예산표</text><text x="617" y="126" text-anchor="middle" class="s">남은 돈은</text><text x="617" y="144" text-anchor="middle" class="s">노션이 계산</text>
  <path d="M174 118 H224" class="arw" marker-end="url(#h)"/>
  <text x="199" y="108" text-anchor="middle" class="al">놓기</text>
  <path d="M486 118 H536" class="arw" marker-end="url(#h)"/>
  <text x="511" y="108" text-anchor="middle" class="al">표 파일</text>
</svg>
