<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img"
     aria-label="슬랙에 올린 파일의 이름을 날짜·제목·생산자 세 조각으로 조립해 하나의 구글 드라이브 폴더에 올리고, 원본 스레드에 링크를 회신하는 구조. 날짜와 제목은 슬랙이 이미 아는 값이라 자동으로 채워지고, 생산자는 알려줄 때만 괄호로 붙는다">
  <style>
    .bx { fill: #ffffff; stroke: #4f252e; stroke-width: 1.4; }
    .safe { fill: #c1ebe9; stroke: #4f252e; stroke-width: 1.4; }
    .lbl { font-size: 15px; font-weight: 700; fill: #4f252e; }
    .name { font-size: 14px; font-weight: 700; fill: #4f252e; }
    .sub { font-size: 12.5px; fill: #8b6068; }
    .flow { font-size: 12.5px; font-weight: 700; fill: #4f252e; }
    .arw { stroke: #f4ae52; stroke-width: 2.6; fill: none; }
    .back { stroke: #f4ae52; stroke-width: 2.6; fill: none; stroke-dasharray: 6 5; }
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }

    .s { opacity: 0; animation: in .5s ease forwards; }
    .s1 { animation-delay: .10s } .s2 { animation-delay: .45s } .s3 { animation-delay: .80s }
    .s4 { animation-delay: 1.15s } .s5 { animation-delay: 1.50s }
    @keyframes in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .s { opacity: 1; animation: none; } }

    @media (prefers-color-scheme: dark) {
      .bx { fill: #3b1f26; stroke: #f3ddd2; }
      .safe { fill: #1d5a5c; stroke: #f3ddd2; }
      .lbl, .name { fill: #f8ece1; }
      .sub { fill: #c6a29e; }
      .flow { fill: #f4ae52; }
    }
  </style>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f4ae52" />
    </marker>
  </defs>

  <g class="s s1">
    <rect x="0" y="64" width="126" height="92" rx="10" class="bx" />
    <text x="63" y="92" text-anchor="middle" class="lbl">슬랙 채널</text>
    <text x="63" y="115" text-anchor="middle" class="sub">파일만 던진다</text>
    <text x="63" y="134" text-anchor="middle" class="sub">5분 기다린다</text>
  </g>

  <g class="s s2">
    <path d="M132 110 H162" class="arw" marker-end="url(#d)" />

    <rect x="170" y="40" width="150" height="48" rx="9" class="bx" />
    <text x="245" y="62" text-anchor="middle" class="lbl">날짜</text>
    <text x="245" y="80" text-anchor="middle" class="sub">올라온 시각</text>

    <rect x="170" y="96" width="150" height="48" rx="9" class="bx" />
    <text x="245" y="118" text-anchor="middle" class="lbl">제목</text>
    <text x="245" y="136" text-anchor="middle" class="sub">메시지 본문</text>

    <rect x="170" y="152" width="150" height="48" rx="9" class="bx" />
    <text x="245" y="174" text-anchor="middle" class="lbl">(생산자)</text>
    <text x="245" y="192" text-anchor="middle" class="sub">알려줄 때만</text>
  </g>

  <g class="s s3">
    <path d="M326 64 C352 64 350 120 366 120" class="arw" />
    <path d="M326 120 H366" class="arw" />
    <path d="M326 176 C352 176 350 120 366 120" class="arw" />
    <path d="M360 120 H374" class="arw" marker-end="url(#d)" />

    <rect x="384" y="86" width="376" height="68" rx="10" class="safe" />
    <text x="572" y="116" text-anchor="middle" class="name">[2026-08-09] 하계워크숍기획 (박지원).pdf</text>
    <text x="572" y="138" text-anchor="middle" class="sub">윈도우에서 깨지는 문자 제거 · 180자에서 자름</text>
  </g>

  <g class="s s4">
    <path d="M572 160 V186" class="arw" marker-end="url(#d)" />
    <rect x="472" y="196" width="200" height="60" rx="10" class="bx" />
    <text x="572" y="221" text-anchor="middle" class="lbl">드라이브 폴더 하나</text>
    <text x="572" y="241" text-anchor="middle" class="sub">이름순 정렬이 곧 시간순</text>
  </g>

  <g class="s s5">
    <path d="M512 260 V276 H63 V162" class="back" marker-end="url(#d)" />
    <text x="290" y="270" text-anchor="middle" class="flow">스레드에 링크 회신</text>
    <text x="0" y="290" class="sub">생산자는 올린 사람으로 짐작하지 않는다 — 안 알려주면 괄호째 빠진다</text>
  </g>
</svg>
