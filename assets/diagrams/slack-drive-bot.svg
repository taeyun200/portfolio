<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="카톡으로 받은 파일을 대화방에 넘기면 심부름꾼이 1분마다 집어 5분 기다린 뒤 이름을 [날짜] 제목 (만든 곳)으로 통일해 공유 드라이브 폴더 하나에 올리고 링크로 답한다. 드라이브는 이 프로그램이 만든 파일만 다룬다.">
  <style>
    text { font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #1d1a17; stroke-width: 1.3; }
    .key  { fill: #fdf0e6; stroke: #c9561c; stroke-width: 2.2; }
    .ghost { fill: none; stroke: #6f6860; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #ebe6de; }
    .zone { fill: #faf8f4; stroke: #8a837a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8a837a; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #1d1a17; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #c9561c; stroke-width: 2.2; fill: none; }
    .no   { stroke: #8a837a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #a9460f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #c9561c; }
    .node { fill: #1d1a17; }
    .t  { fill: #1d1a17; font-size: 14px; font-weight: 700; }
    .tb { fill: #1d1a17; font-size: 16px; font-weight: 800; }
    .s  { fill: #6f6860; font-size: 12px; }
    .c  { fill: #1d1a17; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #6f6860; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #6f6860; font-size: 10.5px; }
    .al { fill: #a9460f; font-size: 12px; font-weight: 700;
          paint-order: stroke; stroke: #f5f2ec; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #262220; stroke: #f1ece6; }
      .key  { fill: #3a2618; stroke: #f08a4b; }
      .ghost, .zone, .ring, .no { stroke: #a79f95; }
      .chip { fill: #2d2824; }
      .zone { fill: #1f1b18; }
      .ln   { stroke: #f1ece6; }
      .arw  { stroke: #f08a4b; }
      .dot  { fill: #f08a4b; }
      .x    { stroke: #f39a62; }
      .node { fill: #f1ece6; }
      .t, .tb, .c { fill: #f1ece6; }
      .s, .zl, .rl { fill: #a79f95; }
      .al { fill: #f39a62; stroke: #221e1b; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="8" y="22" width="176" height="206" rx="14" class="zone"/><text x="22" y="41" text-anchor="start" class="zl">카톡 단체방</text>
  <rect x="206" y="22" width="290" height="206" rx="14" class="zone"/><text x="220" y="41" text-anchor="start" class="zl">대화방</text>
  <rect x="518" y="22" width="194" height="206" rx="14" class="zone"/><text x="532" y="41" text-anchor="start" class="zl">공유 드라이브</text>
  <rect x="24" y="70" width="144" height="96" rx="12" class="box"/><text x="96" y="105" text-anchor="middle" class="t">받은 파일</text><text x="96" y="126" text-anchor="middle" class="s">기한 지나면</text><text x="96" y="144" text-anchor="middle" class="s">사라짐</text>
  <rect x="222" y="56" width="258" height="96" rx="14" class="key"/><text x="351" y="91" text-anchor="middle" class="tb">심부름꾼 · 1분마다</text><text x="351" y="112" text-anchor="middle" class="s">5분 기다렸다가 올림</text><text x="351" y="130" text-anchor="middle" class="s">같은 이름 있으면 건너뜀</text>
  <path d="M351 154 V166" class="ln"/>
  <rect x="222" y="168" width="258" height="44" rx="12" class="box"/><text x="351" y="195" text-anchor="middle" class="t">만든 곳은 알려줄 때만</text>
  <rect x="534" y="56" width="162" height="96" rx="12" class="box"/><text x="615" y="91" text-anchor="middle" class="t">폴더 하나</text><text x="615" y="112" text-anchor="middle" class="s">[날짜] 제목 (만든 곳)</text><text x="615" y="130" text-anchor="middle" class="s">이름순 = 시간순</text>
  <text x="615" y="184" text-anchor="middle" class="s">이 프로그램이 만든</text>
  <text x="615" y="202" text-anchor="middle" class="s">파일만 다룸</text>
  <path d="M170 118 H220" class="arw" marker-end="url(#h)"/>
  <text x="195" y="108" text-anchor="middle" class="al">바로 넘김</text>
  <path d="M482 88 H532" class="arw" marker-end="url(#h)"/>
  <text x="507" y="78" text-anchor="middle" class="al">이름 통일</text>
  <path d="M532 122 H482" class="arw" marker-end="url(#h)"/>
  <text x="507" y="142" text-anchor="middle" class="al">링크 회신</text>
</svg>
