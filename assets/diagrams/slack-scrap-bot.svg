<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="대화방에 던진 링크와 파일을 내 컴퓨터의 심부름꾼이 1분마다 집어, 종류를 가리고 분량에 맞춰 정리해 노트에 쌓는다. 처리 여부는 대화방 표시로 남기고, 노트의 항목 목록은 그때그때 읽어 온다.">
  <style>
    text { font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #1d1a17; stroke-width: 1.3; }
    .key  { fill: #fdf0e6; stroke: #c9561c; stroke-width: 2.2; }
    .ghost { fill: none; stroke: #6f6860; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #ebe6de; }
    .zone { fill: #faf8f4; stroke: #8a837a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8a837a; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #1d1a17; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #c9561c; stroke-width: 2.2; fill: none; }
    .no   { stroke: #8a837a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #a9460f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #c9561c; }
    .node { fill: #1d1a17; }
    .t  { fill: #1d1a17; font-size: 14px; font-weight: 700; }
    .tb { fill: #1d1a17; font-size: 16px; font-weight: 800; }
    .s  { fill: #6f6860; font-size: 12px; }
    .c  { fill: #1d1a17; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #6f6860; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #6f6860; font-size: 10.5px; }
    .al { fill: #a9460f; font-size: 12px; font-weight: 700;
          paint-order: stroke; stroke: #f5f2ec; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #262220; stroke: #f1ece6; }
      .key  { fill: #3a2618; stroke: #f08a4b; }
      .ghost, .zone, .ring, .no { stroke: #a79f95; }
      .chip { fill: #2d2824; }
      .zone { fill: #1f1b18; }
      .ln   { stroke: #f1ece6; }
      .arw  { stroke: #f08a4b; }
      .dot  { fill: #f08a4b; }
      .x    { stroke: #f39a62; }
      .node { fill: #f1ece6; }
      .t, .tb, .c { fill: #f1ece6; }
      .s, .zl, .rl { fill: #a79f95; }
      .al { fill: #f39a62; stroke: #221e1b; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="8" y="22" width="196" height="206" rx="14" class="zone"/><text x="22" y="41" text-anchor="start" class="zl">대화방</text>
  <rect x="226" y="22" width="268" height="206" rx="14" class="zone"/><text x="240" y="41" text-anchor="start" class="zl">내 컴퓨터 · 1분마다</text>
  <rect x="516" y="22" width="196" height="206" rx="14" class="zone"/><text x="530" y="41" text-anchor="start" class="zl">노트</text>
  <rect x="24" y="56" width="164" height="64" rx="12" class="box"/><text x="106" y="84" text-anchor="middle" class="t">링크 · 파일</text><text x="106" y="105" text-anchor="middle" class="s">던져 두기만</text>
  <rect x="24" y="140" width="164" height="68" rx="12" class="box"/><text x="106" y="170" text-anchor="middle" class="t">처리 표시</text><text x="106" y="191" text-anchor="middle" class="s">완료 · 실패 · 집는 중</text>
  <rect x="244" y="56" width="232" height="152" rx="14" class="key"/><text x="360" y="101" text-anchor="middle" class="tb">심부름꾼</text><text x="360" y="122" text-anchor="middle" class="s">종류부터 가리기</text><text x="360" y="140" text-anchor="middle" class="s">분량 맞춰 깊이 조절</text><text x="360" y="158" text-anchor="middle" class="s">비판적으로 볼 지점</text><text x="360" y="176" text-anchor="middle" class="s">그대로 옮긴 문장</text>
  <rect x="532" y="56" width="164" height="78" rx="12" class="box"/><text x="614" y="91" text-anchor="middle" class="t">정리된 요약</text><text x="614" y="112" text-anchor="middle" class="s">핵심 · 인용 · 비판</text>
  <rect x="532" y="150" width="164" height="58" rx="12" class="box"/><text x="614" y="175" text-anchor="middle" class="t">항목 목록</text><text x="614" y="196" text-anchor="middle" class="s">노트에서 늘리면 끝</text>
  <path d="M190 88 H242" class="arw" marker-end="url(#h)"/>
  <text x="216" y="78" text-anchor="middle" class="al">안 한 것만</text>
  <path d="M242 174 H190" class="arw" marker-end="url(#h)"/>
  <text x="216" y="198" text-anchor="middle" class="al">표시 남김</text>
  <path d="M478 95 H530" class="arw" marker-end="url(#h)"/>
  <text x="504" y="85" text-anchor="middle" class="al">쌓기</text>
  <path d="M530 179 H478" class="arw" marker-end="url(#h)"/>
  <text x="504" y="202" text-anchor="middle" class="al">읽어 옴</text>
</svg>
