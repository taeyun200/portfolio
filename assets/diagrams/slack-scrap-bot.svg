<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img"
     aria-label="슬랙 채널에 던진 링크를 1분마다 도는 스케줄러가 집어 Gemini로 분석하고 노션 페이지로 만든 뒤, 원본 스레드에 요약을 회신하는 구조. 처리 상태는 별도 DB 없이 슬랙 리액션에 저장한다">
  <style>
    .bx { fill: #ffffff; stroke: #4f252e; stroke-width: 1.4; }
    .safe { fill: #c1ebe9; stroke: #4f252e; stroke-width: 1.4; }
    .lbl { font-size: 15px; font-weight: 700; fill: #4f252e; }
    .sub { font-size: 12.5px; fill: #8b6068; }
    .flow { font-size: 12.5px; font-weight: 700; fill: #4f252e; }
    .arw { stroke: #f4ae52; stroke-width: 2.6; fill: none; }
    .back { stroke: #f4ae52; stroke-width: 2.6; fill: none; stroke-dasharray: 6 5; }
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }

    .s { opacity: 0; animation: in .5s ease forwards; }
    .s1 { animation-delay: .10s } .s2 { animation-delay: .45s } .s3 { animation-delay: .80s }
    .s4 { animation-delay: 1.15s } .s5 { animation-delay: 1.50s }
    @keyframes in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .s { opacity: 1; animation: none; } }

    @media (prefers-color-scheme: dark) {
      .bx { fill: #3b1f26; stroke: #f3ddd2; }
      .safe { fill: #1d5a5c; stroke: #f3ddd2; }
      .lbl { fill: #f8ece1; }
      .sub { fill: #c6a29e; }
      .flow { fill: #f4ae52; }
    }
  </style>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f4ae52" />
    </marker>
  </defs>

  <g class="s s1">
    <rect x="0" y="54" width="134" height="92" rx="10" class="bx" />
    <text x="67" y="80" text-anchor="middle" class="lbl">슬랙 채널</text>
    <text x="67" y="104" text-anchor="middle" class="sub">유튜브 · 인스타</text>
    <text x="67" y="122" text-anchor="middle" class="sub">웹문서 · PDF</text>
  </g>

  <g class="s s2">
    <path d="M140 100 H166" class="arw" marker-end="url(#n)" />
    <rect x="172" y="54" width="164" height="92" rx="10" class="bx" />
    <text x="254" y="80" text-anchor="middle" class="lbl">1분마다 스캔</text>
    <text x="254" y="104" text-anchor="middle" class="sub">리액션 없는 메시지만</text>
    <text x="254" y="122" text-anchor="middle" class="sub">👀 로 선점하고 처리</text>
  </g>

  <g class="s s3">
    <path d="M342 100 H368" class="arw" marker-end="url(#n)" />
    <rect x="374" y="54" width="176" height="92" rx="10" class="bx" />
    <text x="462" y="78" text-anchor="middle" class="lbl">AI 분석</text>
    <text x="462" y="100" text-anchor="middle" class="sub">자료유형 먼저 분류</text>
    <text x="462" y="118" text-anchor="middle" class="sub">유형별 항목만 채움</text>
    <text x="462" y="136" text-anchor="middle" class="sub">분량 따라 깊이 조절</text>
  </g>

  <g class="s s4">
    <path d="M556 100 H582" class="arw" marker-end="url(#n)" />
    <rect x="588" y="54" width="172" height="92" rx="10" class="safe" />
    <text x="674" y="78" text-anchor="middle" class="lbl">노션 페이지</text>
    <text x="674" y="100" text-anchor="middle" class="sub">핵심 · 인용 · 타임라인</text>
    <text x="674" y="118" text-anchor="middle" class="sub">비판적으로 볼 지점</text>
    <text x="674" y="136" text-anchor="middle" class="sub">선택지는 노션에서 읽음</text>
  </g>

  <g class="s s5">
    <path d="M674 152 V194 H67 V152" class="back" marker-end="url(#n)" />
    <text x="370" y="188" text-anchor="middle" class="flow">원본 스레드에 요약 회신</text>
    <text x="0" y="234" class="sub">처리 상태는 DB 없이 슬랙 리액션에 —  ✅ 완료  ·  ⚠️ 영구 실패  ·  👀 처리 중</text>
  </g>
</svg>
