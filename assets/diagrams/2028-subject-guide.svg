<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img"
     aria-label="대교협 학과별 권장과목 자료를 학생이 찾아보기 쉬운 형태로 재정리해 서버 없이 단일 HTML로 배포한 구조">
  <style>
    .bx { fill: #ffffff; stroke: #4f252e; stroke-width: 1.4; }
    .safe { fill: #c1ebe9; stroke: #4f252e; stroke-width: 1.4; }
    .lbl { font-size: 15px; font-weight: 700; fill: #4f252e; }
    .sub { font-size: 12.5px; fill: #8b6068; }
    .arw { stroke: #f4ae52; stroke-width: 2.6; fill: none; }
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }

    .s { opacity: 0; animation: in .5s ease forwards; }
    .s1 { animation-delay: .10s } .s2 { animation-delay: .45s } .s3 { animation-delay: .80s }
    .s4 { animation-delay: 1.15s }
    @keyframes in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .s { opacity: 1; animation: none; } }

    @media (prefers-color-scheme: dark) {
      .bx { fill: #3b1f26; stroke: #f3ddd2; }
      .safe { fill: #1d5a5c; stroke: #f3ddd2; }
      .lbl { fill: #f8ece1; }
      .sub { fill: #c6a29e; }
    }
  </style>
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f4ae52" />
    </marker>
  </defs>

  <g class="s s1">
    <rect x="0" y="34" width="158" height="76" rx="10" class="bx" />
    <text x="79" y="60" text-anchor="middle" class="lbl">대교협 자료</text>
    <text x="79" y="82" text-anchor="middle" class="sub">학과별 권장 선택과목</text>
    <text x="79" y="100" text-anchor="middle" class="sub">문서로 배포됨</text>
  </g>

  <g class="s s2">
    <path d="M164 72 H216" class="arw" marker-end="url(#t)" />
    <rect x="226" y="34" width="158" height="76" rx="10" class="safe" />
    <text x="305" y="60" text-anchor="middle" class="lbl">2차 가공</text>
    <text x="305" y="82" text-anchor="middle" class="sub">학과 이름으로</text>
    <text x="305" y="100" text-anchor="middle" class="sub">찾을 수 있게 재정리</text>
  </g>

  <g class="s s3">
    <path d="M390 72 H442" class="arw" marker-end="url(#t)" />
    <rect x="452" y="24" width="168" height="96" rx="10" class="bx" />
    <text x="536" y="50" text-anchor="middle" class="lbl">단일 HTML</text>
    <text x="536" y="72" text-anchor="middle" class="sub">서버 없이 정적 배포</text>
    <text x="536" y="92" text-anchor="middle" class="sub">학생이 직접 검색</text>
    <text x="536" y="112" text-anchor="middle" class="sub">주소만 알려주면 끝</text>
  </g>

  <g class="s s4">
    <text x="0" y="152" class="sub">학생이 “내가 가고 싶은 학과는 무슨 과목을 들어야 하나”를</text>
    <text x="0" y="170" class="sub">교사에게 묻지 않고 스스로 확인하게 하는 것이 목적입니다.</text>
    <text x="0" y="192" class="sub">2028학년도 대입 개편 대비 자료.</text>
  </g>
</svg>
