<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="지난 진학결과 파일을 브라우저에 끌어다 놓으면 학생 한 명이 한 줄 카드가 되어 내신 순서로 줄을 선다. 올린 파일은 밖으로 나가지 않고, 표를 읽는 도구만 처음 한 번 들어온다.">
  <style>
    text { font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #1d1a17; stroke-width: 1.3; }
    .key  { fill: #fdf0e6; stroke: #c9561c; stroke-width: 2.2; }
    .ghost { fill: none; stroke: #6f6860; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #ebe6de; }
    .zone { fill: #faf8f4; stroke: #8a837a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8a837a; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #1d1a17; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #c9561c; stroke-width: 2.2; fill: none; }
    .no   { stroke: #8a837a; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #a9460f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #c9561c; }
    .node { fill: #1d1a17; }
    .t  { fill: #1d1a17; font-size: 14px; font-weight: 700; }
    .tb { fill: #1d1a17; font-size: 16px; font-weight: 800; }
    .s  { fill: #6f6860; font-size: 12px; }
    .c  { fill: #1d1a17; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #6f6860; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #6f6860; font-size: 10.5px; }
    .al { fill: #a9460f; font-size: 12px; font-weight: 700;
          paint-order: stroke; stroke: #f5f2ec; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #262220; stroke: #f1ece6; }
      .key  { fill: #3a2618; stroke: #f08a4b; }
      .ghost, .zone, .ring, .no { stroke: #a79f95; }
      .chip { fill: #2d2824; }
      .zone { fill: #1f1b18; }
      .ln   { stroke: #f1ece6; }
      .arw  { stroke: #f08a4b; }
      .dot  { fill: #f08a4b; }
      .x    { stroke: #f39a62; }
      .node { fill: #f1ece6; }
      .t, .tb, .c { fill: #f1ece6; }
      .s, .zl, .rl { fill: #a79f95; }
      .al { fill: #f39a62; stroke: #221e1b; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="8" y="22" width="440" height="206" rx="14" class="zone"/><text x="22" y="41" text-anchor="start" class="zl">이 컴퓨터의 브라우저</text>
  <rect x="478" y="22" width="234" height="206" rx="14" class="zone"/><text x="492" y="41" text-anchor="start" class="zl">바깥</text>
  <rect x="26" y="84" width="150" height="92" rx="12" class="box"/><text x="101" y="117" text-anchor="middle" class="t">진학결과 파일</text><text x="101" y="138" text-anchor="middle" class="s">지난해 · 그 전 해</text><text x="101" y="156" text-anchor="middle" class="s">끌어다 놓기</text>
  <path d="M178 130 H206" class="arw" marker-end="url(#h)"/>
  <rect x="210" y="60" width="198" height="140" rx="14" class="key"/><text x="309" y="99" text-anchor="middle" class="tb">한 줄 카드</text><text x="309" y="120" text-anchor="middle" class="s">학생 한 명 = 한 줄</text><text x="309" y="138" text-anchor="middle" class="s">내신 순서로 줄 섬</text><text x="309" y="156" text-anchor="middle" class="s">붙음·떨어짐은 색으로</text><text x="309" y="174" text-anchor="middle" class="s">연도별 탭은 저절로</text>
  <path d="M410 96 H552" class="no"/>
  <path d="M457 90 L469 102 M469 90 L457 102" class="x"/>
  <text x="632" y="90" text-anchor="middle" class="s">올린 파일은</text>
  <text x="632" y="108" text-anchor="middle" class="s">밖으로 나가지 않음</text>
  <rect x="496" y="146" width="198" height="62" rx="12" class="box"/><text x="595" y="173" text-anchor="middle" class="t">표 읽는 도구</text><text x="595" y="194" text-anchor="middle" class="s">처음 한 번만</text>
  <path d="M494 177 C 452 177, 444 168, 410 168" class="arw" marker-end="url(#h)"/>
  <text x="452" y="204" text-anchor="middle" class="al">도구만 들어옴</text>
</svg>
