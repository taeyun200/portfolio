<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img"
     aria-label="학과 하나를 검색하면 함께 지원한 학과들이 대학군별 동심원 위에 배치되고, 선 굵기로 함께 지원한 건수를 보여주는 구조">
  <style>
    .bx { fill: #ffffff; stroke: #4f252e; stroke-width: 1.4; }
    .ring { fill: none; stroke: #4f252e; stroke-width: 1; opacity: .32; }
    .hub { fill: #f4ae52; stroke: #4f252e; stroke-width: 1.6; }
    .node { fill: #ffffff; stroke: #4f252e; stroke-width: 1.3; }
    .node-pass { fill: #c1ebe9; stroke: #4f252e; stroke-width: 1.3; }
    .link { stroke: #4f252e; opacity: .38; fill: none; }
    .lbl { font-size: 15px; font-weight: 700; fill: #4f252e; }
    .sub { font-size: 12.5px; fill: #8b6068; }
    .ringlbl { font-size: 10.5px; fill: #8b6068; }
    .flow { font-size: 12.5px; font-weight: 700; fill: #4f252e; }
    .arw { stroke: #f4ae52; stroke-width: 2.6; fill: none; }
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }

    .s { opacity: 0; animation: in .5s ease forwards; }
    .s1 { animation-delay: .10s } .s2 { animation-delay: .45s }
    .s3 { animation-delay: .80s } .s4 { animation-delay: 1.15s }
    @keyframes in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .s { opacity: 1; animation: none; } }

    @media (prefers-color-scheme: dark) {
      .bx { fill: #3b1f26; stroke: #f3ddd2; }
      .node { fill: #3b1f26; stroke: #f3ddd2; }
      .node-pass { fill: #1d5a5c; stroke: #f3ddd2; }
      .ring, .link { stroke: #f3ddd2; }
      .lbl, .flow { fill: #f8ece1; }
      .sub, .ringlbl { fill: #c6a29e; }
    }
  </style>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f4ae52" />
    </marker>
  </defs>

  <g class="s s1">
    <rect x="0" y="66" width="132" height="66" rx="10" class="bx" />
    <text x="66" y="92" text-anchor="middle" class="lbl">학과 검색</text>
    <text x="66" y="112" text-anchor="middle" class="sub">“고려대 간호대학”</text>
  </g>

  <g class="s s2">
    <path d="M138 99 H176" class="arw" marker-end="url(#n)" />
    <rect x="186" y="30" width="164" height="140" rx="10" class="bx" />
    <text x="268" y="56" text-anchor="middle" class="lbl">지난 진학결과</text>
    <text x="268" y="80" text-anchor="middle" class="sub">그 학과 지원자가</text>
    <text x="268" y="98" text-anchor="middle" class="sub">같이 쓴 학과를</text>
    <text x="268" y="116" text-anchor="middle" class="sub">모아 셈</text>
    <text x="268" y="146" text-anchor="middle" class="sub">‘N명 이상만’ 필터</text>
  </g>

  <g class="s s3">
    <path d="M356 99 H394" class="arw" marker-end="url(#n)" />
  </g>

  <g class="s s4">
    <circle cx="574" cy="100" r="88" class="ring" />
    <circle cx="574" cy="100" r="62" class="ring" />
    <circle cx="574" cy="100" r="34" class="ring" />

    <path d="M574 100 L574 38" class="link" stroke-width="7" />
    <path d="M574 100 L512 138" class="link" stroke-width="5" />
    <path d="M574 100 L636 66" class="link" stroke-width="3" />
    <path d="M574 100 L662 100" class="link" stroke-width="2" />

    <circle cx="574" cy="100" r="16" class="hub" />
    <circle cx="574" cy="38" r="8" class="node" />
    <circle cx="512" cy="138" r="8" class="node-pass" />
    <circle cx="636" cy="66" r="8" class="node" />
    <circle cx="662" cy="100" r="8" class="node" />

    <text x="574" y="128" text-anchor="middle" class="sub">검색한 학과</text>
    <text x="574" y="24" text-anchor="middle" class="ringlbl">바깥일수록 하위 대학군</text>
    <text x="404" y="100" class="ringlbl">SKY</text>
    <text x="404" y="118" class="ringlbl">7개대</text>
    <text x="404" y="136" class="ringlbl">11개대학</text>
    <text x="404" y="154" class="ringlbl">15개대학</text>
    <text x="404" y="172" class="ringlbl">수도권 중상위권</text>

    <text x="404" y="60" class="sub">선 굵기 = 함께 지원한 수</text>
    <text x="404" y="78" class="sub">점 색 = 합격 여부</text>
  </g>
</svg>
