<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="지난 진학결과에서 한 학과를 검색하면 그 학과 지원자들이 함께 지원한 학과를 선으로 잇는다. 가운데에서 멀수록 문턱이 낮은 대학군이고, 선이 굵을수록 함께 쓴 사람이 많다.">
  <style>
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #4f252e; stroke-width: 1.3; }
    .key  { fill: #fff7c5; stroke: #f4ae52; stroke-width: 2.4; }
    .ghost { fill: none; stroke: #8b6068; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #c1ebe9; }
    .zone { fill: #fffaf0; stroke: #8b6068; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8b6068; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #4f252e; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #f4ae52; stroke-width: 2.4; fill: none; }
    .no   { stroke: #8b6068; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #b35c0f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #f4ae52; }
    .node { fill: #4f252e; }
    .t  { fill: #4f252e; font-size: 14px; font-weight: 700; }
    .tb { fill: #4f252e; font-size: 16px; font-weight: 700; }
    .s  { fill: #8b6068; font-size: 12px; }
    .c  { fill: #4f252e; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #8b6068; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #8b6068; font-size: 10.5px; }
    .al { fill: #b35c0f; font-size: 12px; font-weight: 600;
          paint-order: stroke; stroke: #fdf4e4; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #32191f; stroke: #f8ece1; }
      .key  { fill: #4a3a1e; }
      .ghost, .zone, .ring, .no { stroke: #c6a29e; }
      .chip { fill: #1d5a5c; }
      .zone { fill: #2f171c; }
      .ln   { stroke: #f8ece1; }
      .x    { stroke: #f4ae52; }
      .node { fill: #f8ece1; }
      .t, .tb, .c { fill: #f8ece1; }
      .s, .zl, .rl { fill: #c6a29e; }
      .al { fill: #f4ae52; stroke: #2c151a; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="10" y="70" width="176" height="108" rx="12" class="box"/><text x="98" y="111" text-anchor="middle" class="t">지난 진학결과</text><text x="98" y="132" text-anchor="middle" class="s">지원 건이 한 줄씩</text><text x="98" y="150" text-anchor="middle" class="s">조합은 안 보임</text>
  <path d="M188 124 H226" class="arw" marker-end="url(#h)"/>
  <rect x="230" y="70" width="200" height="108" rx="14" class="key"/><text x="330" y="111" text-anchor="middle" class="tb">함께 쓴 학과 잇기</text><text x="330" y="132" text-anchor="middle" class="s">선 굵기 = 함께 쓴 사람 수</text><text x="330" y="150" text-anchor="middle" class="s">'몇 명 이상만' 거르기</text>
  <path d="M432 124 H488" class="arw" marker-end="url(#h)"/>
  <text x="460" y="114" text-anchor="middle" class="al">학과 검색</text>
  <text x="590" y="20" text-anchor="middle" class="zl">가운데서 멀수록 문턱이 낮은 대학군</text>
  <circle cx="590" cy="124" r="24" class="ring"/>
  <circle cx="590" cy="124" r="48" class="ring"/>
  <circle cx="590" cy="124" r="72" class="ring"/>
  <circle cx="590" cy="124" r="96" class="ring"/>
  <text x="590" y="128" text-anchor="middle" class="rl">SKY</text>
  <text x="590" y="92" text-anchor="middle" class="rl">7개대</text>
  <text x="590" y="68" text-anchor="middle" class="rl">11개대</text>
  <text x="590" y="44" text-anchor="middle" class="rl">15개대</text>
  <path d="M590 124 L545 140" class="ln" style="stroke-width:3.5"/>
  <path d="M590 124 L652 88" class="ln" style="stroke-width:2.4"/>
  <path d="M590 124 L507 76" class="ln" style="stroke-width:1.2"/>
  <path d="M590 124 L626 186" class="ln" style="stroke-width:2"/>
  <path d="M590 124 L685 141" class="ln" style="stroke-width:1"/>
  <circle cx="545" cy="140" r="4.5" class="node"/>
  <circle cx="652" cy="88" r="4.5" class="node"/>
  <circle cx="507" cy="76" r="4.5" class="node"/>
  <circle cx="626" cy="186" r="4.5" class="node"/>
  <circle cx="685" cy="141" r="4.5" class="node"/>
  <circle cx="590" cy="124" r="7" class="dot"/>
</svg>
