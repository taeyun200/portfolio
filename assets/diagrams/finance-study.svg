<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img"
     aria-label="회사가 직접 낸 서류에서 계산한 값만 판단에 쓰고 시세 사이트 숫자는 옆에 나란히만 둔다. 42문항 중 16개는 사람만 답한다. 여러 잣대로 채점해 결론과 왜 샀는지를 남기고, 주문은 넣지 않는다.">
  <style>
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .box  { fill: #ffffff; stroke: #4f252e; stroke-width: 1.3; }
    .key  { fill: #fff7c5; stroke: #f4ae52; stroke-width: 2.4; }
    .ghost { fill: none; stroke: #8b6068; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .chip { fill: #c1ebe9; }
    .zone { fill: #fffaf0; stroke: #8b6068; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ring { fill: none; stroke: #8b6068; stroke-width: 1; stroke-dasharray: 2 4; }
    .ln   { stroke: #4f252e; stroke-width: 1.4; fill: none; }
    .arw  { stroke: #f4ae52; stroke-width: 2.4; fill: none; }
    .no   { stroke: #8b6068; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .x    { stroke: #b35c0f; stroke-width: 2.4; stroke-linecap: round; }
    .dot  { fill: #f4ae52; }
    .node { fill: #4f252e; }
    .t  { fill: #4f252e; font-size: 14px; font-weight: 700; }
    .tb { fill: #4f252e; font-size: 16px; font-weight: 700; }
    .s  { fill: #8b6068; font-size: 12px; }
    .c  { fill: #4f252e; font-size: 12.5px; font-weight: 600; }
    .zl { fill: #8b6068; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .rl { fill: #8b6068; font-size: 10.5px; }
    .al { fill: #b35c0f; font-size: 12px; font-weight: 600;
          paint-order: stroke; stroke: #fdf4e4; stroke-width: 4px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #32191f; stroke: #f8ece1; }
      .key  { fill: #4a3a1e; }
      .ghost, .zone, .ring, .no { stroke: #c6a29e; }
      .chip { fill: #1d5a5c; }
      .zone { fill: #2f171c; }
      .ln   { stroke: #f8ece1; }
      .x    { stroke: #f4ae52; }
      .node { fill: #f8ece1; }
      .t, .tb, .c { fill: #f8ece1; }
      .s, .zl, .rl { fill: #c6a29e; }
      .al { fill: #f4ae52; stroke: #2c151a; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dot"/>
    </marker>
  </defs>
  <rect x="10" y="40" width="170" height="60" rx="12" class="box"/><text x="95" y="66" text-anchor="middle" class="t">회사가 낸 서류</text><text x="95" y="87" text-anchor="middle" class="s">직접 계산</text>
  <rect x="10" y="136" width="170" height="60" rx="12" class="ghost"/><text x="95" y="162" text-anchor="middle" class="t">시세 사이트</text><text x="95" y="183" text-anchor="middle" class="s">참고로 옆에만</text>
  <path d="M182 70 C 214 70, 216 100, 248 100" class="arw" marker-end="url(#h)"/>
  <text x="214" y="58" text-anchor="middle" class="al">판단에 씀</text>
  <path d="M182 166 C 214 166, 216 140, 248 140" class="no"/>
  <text x="214" y="184" text-anchor="middle" class="al">나란히만</text>
  <rect x="250" y="36" width="230" height="168" rx="14" class="key"/>
  <text x="365" y="62" text-anchor="middle" class="tb">42문항 시험지</text>
  <rect x="266" y="80" width="198" height="28" rx="14" class="chip"/><text x="365" y="98.5" text-anchor="middle" class="c">기계가 채점 · 13</text>
  <rect x="266" y="116" width="198" height="28" rx="14" class="chip"/><text x="365" y="134.5" text-anchor="middle" class="c">조사해서 채움 · 13</text>
  <rect x="266" y="152" width="198" height="28" rx="14" class="box"/>
  <text x="365" y="170.5" text-anchor="middle" class="c">사람만 답함 · 16</text>
  <path d="M482 82 H524" class="arw" marker-end="url(#h)"/>
  <rect x="526" y="40" width="186" height="84" rx="12" class="box"/><text x="619" y="69" text-anchor="middle" class="t">결론 + 왜 샀는지</text><text x="619" y="90" text-anchor="middle" class="s">여러 잣대 중 가장 좋은 쪽</text><text x="619" y="108" text-anchor="middle" class="s">틀린 답도 지우지 않음</text>
  <path d="M482 172 H524" class="no"/>
  <path d="M497 166 L509 178 M509 166 L497 178" class="x"/>
  <rect x="526" y="148" width="186" height="48" rx="12" class="ghost"/><text x="619" y="177" text-anchor="middle" class="t">주문</text>
  <text x="503" y="216" text-anchor="middle" class="al">넣지 않음</text>
</svg>
